<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#6d28d9">

<title>Крипто Нострадамус</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#02040c;
font-family:Georgia,serif;
color:#fff
}

body{
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,
#26104f 0%,
#090b16 45%,
#02040c 100%);
}

/* ===== APP ===== */

#app{
position:relative;
width:100%;
height:100dvh;
display:none;
flex-direction:column;
overflow:hidden
}

/* ===== STARS ===== */

#stars{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0
}

.star{
position:absolute;
background:#fff;
border-radius:50%;
opacity:.3;
animation:twinkle 4s infinite
}

@keyframes twinkle{

0%,100%{
opacity:.1
}

50%{
opacity:.9
}

}

/* ===== SETUP ===== */

#setup{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:24px;
z-index:100;
background:
radial-gradient(circle at top,
#26104f 0%,
#090b16 50%,
#02040c 100%);
overflow-y:auto
}

#setup h1{
font-size:34px;
margin-top:14px
}

#setup p{
margin-top:10px;
font-size:14px;
line-height:1.7;
color:#c4b5fd;
text-align:center;
max-width:320px
}

.inp{
width:100%;
max-width:340px;
padding:16px;
margin-top:22px;
border-radius:18px;
border:1px solid rgba(168,85,247,.4);
background:rgba(255,255,255,.05);
color:#fff;
font-size:15px;
outline:none
}

.btn{
width:100%;
max-width:340px;
padding:16px;
margin-top:14px;
border:none;
border-radius:18px;
cursor:pointer;
font-size:15px;
color:#fff;
background:
linear-gradient(135deg,
#5b21b6,
#7c3aed);
box-shadow:
0 0 30px rgba(124,58,237,.35)
}

#err{
margin-top:10px;
font-size:12px;
color:#ef4444;
min-height:18px
}

/* ===== TOP ===== */

#top{
position:relative;
z-index:5;
display:flex;
justify-content:space-between;
align-items:center;
padding:
max(14px,env(safe-area-inset-top))
14px
12px;
background:rgba(5,8,16,.82);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.05)
}

#logo{
display:flex;
align-items:center;
gap:10px
}

#orb{
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
background:
linear-gradient(135deg,
#6d28d9,
#9333ea);
box-shadow:
0 0 35px rgba(168,85,247,.45)
}

#ttl{
font-size:15px;
font-weight:700
}

#sub{
margin-top:2px;
font-size:10px;
letter-spacing:2px;
color:#a855f7
}

#topBtns{
display:flex;
gap:8px
}

.sbtn{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:
linear-gradient(135deg,
#5b21b6,
#7c3aed);
color:#fff;
font-size:16px
}

/* ===== FEED ===== */

#feed{
position:relative;
z-index:2;
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px
}

.msg{
max-width:88%;
padding:14px;
border-radius:22px;
line-height:1.7;
font-size:14px;
white-space:pre-wrap
}

.user{
align-self:flex-end;
background:
linear-gradient(135deg,
#6d28d9,
#7c3aed)
}

.bot{
align-self:flex-start;
background:
linear-gradient(135deg,
rgba(30,41,59,.92),
rgba(17,24,39,.95));
border:1px solid rgba(255,255,255,.06)
}

/* ===== ACTIONS ===== */

#actions{
position:relative;
z-index:5;
display:flex;
gap:8px;
padding:0 12px 12px
}

.abtn{
flex:1;
padding:14px;
border:none;
border-radius:18px;
font-size:13px;
color:#fff;
background:
linear-gradient(135deg,
rgba(91,33,182,.22),
rgba(17,24,39,.72));
border:1px solid rgba(168,85,247,.18)
}

/* ===== MODAL ===== */

.modal{
position:fixed;
inset:0;
display:none;
flex-direction:column;
background:
radial-gradient(circle at center,
rgba(91,33,182,.18) 0%,
rgba(5,8,16,.97) 55%,
rgba(2,4,12,1) 100%);
backdrop-filter:blur(20px);
z-index:90;
overflow:hidden
}

/* ===== RUNE ROOM ===== */

#runeModal::before{
content:'';
position:absolute;
width:460px;
height:460px;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
border:1px solid rgba(168,85,247,.12);
box-shadow:
0 0 60px rgba(168,85,247,.14),
inset 0 0 60px rgba(168,85,247,.08);
animation:runeRotate 40s linear infinite
}

#runeModal::after{
content:'✶';
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:420px;
color:rgba(168,85,247,.03);
pointer-events:none
}

@keyframes runeRotate{

from{
transform:
translate(-50%,-50%)
rotate(0deg)
}

to{
transform:
translate(-50%,-50%)
rotate(360deg)
}

}

.mtop{
position:relative;
z-index:5;
display:flex;
justify-content:space-between;
align-items:center;
padding:
max(14px,env(safe-area-inset-top))
14px
14px
}

.close{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.08);
color:#fff;
font-size:18px
}

.mbody{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
z-index:5
}

/* ===== RUNE CARD ===== */

#runeCard{
position:relative;
width:100%;
max-width:360px;
padding:42px 24px;
border-radius:34px;
overflow:hidden;
text-align:center;

background:
linear-gradient(135deg,
rgba(91,33,182,.12),
rgba(17,24,39,.62));

border:1px solid rgba(168,85,247,.18);

backdrop-filter:blur(18px);

box-shadow:
0 0 60px rgba(168,85,247,.18),
inset 0 0 40px rgba(255,255,255,.03);

animation:runeAppear 1s ease
}

@keyframes runeAppear{

0%{
opacity:0;
transform:
scale(.7)
translateY(40px);
filter:blur(12px)
}

100%{
opacity:1;
transform:
scale(1)
translateY(0);
filter:blur(0)
}

}

#runeAura{
position:absolute;
width:260px;
height:260px;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:
radial-gradient(circle,
rgba(168,85,247,.25) 0%,
rgba(168,85,247,.08) 40%,
transparent 70%);
filter:blur(22px);
animation:auraPulse 4s ease-in-out infinite
}

@keyframes auraPulse{

0%,100%{
opacity:.6;
transform:
translate(-50%,-50%)
scale(1)
}

50%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.15)
}

}

#runeSymbol{
position:relative;
z-index:2;
font-size:120px;
margin-bottom:18px;
color:#f5e9ff;

text-shadow:
0 0 20px rgba(192,132,252,.9),
0 0 60px rgba(168,85,247,.7);

animation:runePulse 3s ease-in-out infinite
}

@keyframes runePulse{

0%,100%{
transform:scale(1);
filter:brightness(1)
}

50%{
transform:scale(1.08);
filter:brightness(1.35)
}

}

#runeName{
position:relative;
z-index:2;
font-size:30px;
margin-top:8px
}

#runeType{
position:relative;
z-index:2;
margin-top:12px;
color:#c084fc;
letter-spacing:2px;
font-size:13px
}

#runeText{
position:relative;
z-index:2;
margin-top:24px;
line-height:1.9;
font-size:15px;
color:#e9d5ff
}

#openRune{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
z-index:6;
padding:16px 28px;
border:none;
border-radius:20px;
font-size:15px;
color:#fff;
background:
linear-gradient(135deg,
#5b21b6,
#7c3aed);

box-shadow:
0 0 30px rgba(168,85,247,.4)
}

</style>
</head>

<body>

<div id="stars"></div>

<!-- ===== SETUP ===== -->

<div id="setup">

<div style="font-size:80px">🔮</div>

<h1>Крипто Нострадамус</h1>

<p>
Введите API ключ Groq.<br>
Ключ начинается с gsk_
</p>

<input
id="keyInput"
class="inp"
placeholder="gsk_..."
type="password"
>

<div id="err"></div>

<button class="btn" id="saveBtn">
✦ Войти в Оракул
</button>

</div>

<!-- ===== APP ===== -->

<div id="app">

<div id="top">

<div id="logo">

<div id="orb">🔮</div>

<div>

<div id="ttl">
Крипто Нострадамус
</div>

<div id="sub">
ОНЛАЙН • ПРОРОЧЕСТВА
</div>

</div>

</div>

<div id="topBtns">

<button class="sbtn" id="runeBtn">
🎲
</button>

</div>

</div>

<div id="feed"></div>

<div id="actions">

<button class="abtn" id="btcBtn">
₿ Bitcoin
</button>

<button class="abtn" id="ethBtn">
Ξ Ethereum
</button>

</div>

</div>

<!-- ===== RUNE ROOM ===== -->

<div class="modal" id="runeModal">

<div class="mtop">

<div>

<div style="font-size:22px">
🎲 Комната Рун
</div>

<div style="font-size:12px;color:#a855f7;margin-top:4px">
Древние скандинавские пророчества
</div>

</div>

<button class="close" id="closeRune">
✕
</button>

</div>

<div class="mbody">

<div id="runeCard">

<div id="runeAura"></div>

<div id="runeSymbol">
ᚠ
</div>

<div id="runeName">
Феху
</div>

<div id="runeType">
РУНА БОГАТСТВА
</div>

<div id="runeText">
Энергия золота и криптовалют усиливается. Потоки прибыли начинают движение вокруг твоего пути.
</div>

</div>

</div>

</div>

<script>

'use strict';

/* ===== STARS ===== */

for(let i=0;i<80;i++){

const s=document.createElement('div');

s.className='star';

const size=Math.random()*2+1;

s.style.width=size+'px';
s.style.height=size+'px';

s.style.left=Math.random()*100+'%';
s.style.top=Math.random()*100+'%';

s.style.animationDelay=
Math.random()*5+'s';

document
.getElementById('stars')
.appendChild(s);

}

/* ===== HELPERS ===== */

function G(id){
return document.getElementById(id);
}

function addMsg(type,text){

const d=document.createElement('div');

d.className=
'msg '+
(type==='user'?'user':'bot');

d.textContent=text;

G('feed').appendChild(d);

G('feed').scrollTop=
G('feed').scrollHeight;

}

/* ===== RUNES ===== */

const RUNES=[

{
symbol:'ᚠ',
name:'Феху',
type:'РУНА БОГАТСТВА',
text:'Денежные потоки пробуждаются. BTC усиливает твоё направление.'
},

{
symbol:'ᚢ',
name:'Уруз',
type:'РУНА СИЛЫ',
text:'Скрытая энергия рынка начинает накапливаться перед импульсом.'
},

{
symbol:'ᚦ',
name:'Турисаз',
type:'РУНА ЗАЩИТЫ',
text:'Впереди зона турбулентности. Не открывай позиции без знаков.'
},

{
symbol:'ᚨ',
name:'Ансуз',
type:'РУНА ЗНАНИЯ',
text:'Информация станет главным источником прибыли в ближайшие дни.'
},

{
symbol:'ᚱ',
name:'Райдо',
type:'РУНА ПУТИ',
text:'Тренд готовится изменить направление. Следуй за движением.'
},

{
symbol:'ᚲ',
name:'Кеназ',
type:'РУНА ОГНЯ',
text:'Появляется скрытая возможность роста. Рынок начинает пробуждение.'
}

];

/* ===== RUNE SYSTEM ===== */

function openRune(){

const rune=
RUNES[
Math.floor(
Math.random()*RUNES.length
)
];

G('runeSymbol').textContent=
rune.symbol;

G('runeName').textContent=
rune.name;

G('runeType').textContent=
rune.type;

G('runeText').textContent=
rune.text;

G('runeModal').style.display='flex';

}

/* ===== BUTTONS ===== */

G('runeBtn').onclick=()=>{

openRune();

};

G('closeRune').onclick=()=>{

G('runeModal').style.display='none';

};

G('btcBtn').onclick=()=>{

addMsg(
'user',
'🔍 Пророчество Bitcoin'
);

addMsg(
'bot',
'Звёзды усиливают энергию BTC. Магический барьер удерживает цену перед новым импульсом.'
);

};

G('ethBtn').onclick=()=>{

addMsg(
'user',
'🔍 Пророчество Ethereum'
);

addMsg(
'bot',
'Эфир входит в фазу накопления силы. Руны указывают на рост волатильности.'
);

};

/* ===== START ===== */

G('saveBtn').onclick=()=>{

const v=
G('keyInput').value.trim();

if(!v.startsWith('gsk_')){

G('err').textContent=
'Ключ должен начинаться с gsk_';

return;

}

G('setup').style.display='none';

G('app').style.display='flex';

addMsg(
'bot',
'🔮 Добро пожаловать в Крипто Нострадамус.\n\nОткрой комнату рун или выбери монету.'
);

};

</script>

</body>
</html>
