<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Крипто Нострадамус</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#040712;
font-family:Georgia,serif;
color:#fff
}

body{
display:flex;
justify-content:center;
align-items:center
}

#app{
position:relative;
width:100%;
height:100dvh;
overflow:hidden;
display:none;
flex-direction:column;
background:
radial-gradient(circle at top,#1d1040 0%,#050810 40%,#02040c 100%);
padding-bottom:env(safe-area-inset-bottom)
}

/* ===== STARS ===== */

#stars{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0
}

.star{
position:absolute;
background:#fff;
border-radius:50%;
opacity:.4;
animation:twinkle 4s infinite
}

@keyframes twinkle{
0%,100%{opacity:.1}
50%{opacity:.8}
}

/* ===== SETUP ===== */

#setup{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:24px;
background:
radial-gradient(circle at top,#1f1144 0%,#050810 55%);
z-index:50;
text-align:center;
overflow-y:auto
}

#setup h2{
font-size:30px;
margin-top:10px
}

#setup p{
font-size:13px;
line-height:1.8;
color:#b794f4;
margin-top:8px;
max-width:320px
}

.setupGuide{
margin-top:16px;
font-size:12px;
line-height:1.8;
color:#ddd6fe;
max-width:340px;
text-align:left;
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(168,85,247,.18)
}

.inp{
width:100%;
max-width:340px;
padding:15px;
border-radius:16px;
border:1px solid rgba(168,85,247,.4);
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
font-size:15px;
margin-top:18px
}

.btn{
border:none;
cursor:pointer;
border-radius:16px;
background:
linear-gradient(135deg,#5b21b6,#7c3aed);
color:#fff;
padding:15px;
font-size:15px;
width:100%;
max-width:340px;
margin-top:12px;
box-shadow:0 0 24px rgba(124,58,237,.35)
}

#err{
font-size:12px;
color:#ef4444;
margin-top:10px;
min-height:16px
}

/* ===== TOP ===== */

#top{
position:relative;
z-index:2;
display:flex;
justify-content:space-between;
align-items:center;
padding:
max(12px,env(safe-area-inset-top))
12px
8px;
border-bottom:1px solid rgba(255,255,255,.06);
background:rgba(5,8,16,.82);
backdrop-filter:blur(18px)
}

#logo{
display:flex;
gap:10px;
align-items:center
}

#orb{
width:46px;
height:46px;
border-radius:50%;
background:
linear-gradient(135deg,#6d28d9,#9333ea);
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
box-shadow:0 0 24px rgba(168,85,247,.45)
}

#ttl{
font-size:14px;
font-weight:700
}

#sub{
font-size:9px;
color:#a855f7;
margin-top:2px;
letter-spacing:2px
}

#topBtns{
display:flex;
gap:8px
}

.sbtn{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:
linear-gradient(135deg,#5b21b6,#7c3aed);
color:#fff;
font-size:16px;
cursor:pointer;
box-shadow:0 0 20px rgba(168,85,247,.4)
}

/* ===== PRICES ===== */

#prices{
position:relative;
z-index:2;
display:flex;
gap:6px;
overflow-x:auto;
padding:8px 10px;
scrollbar-width:none
}

.pc{
min-width:82px;
padding:8px;
border-radius:14px;
background:rgba(255,255,255,.04);
border:1px solid rgba(168,85,247,.18);
backdrop-filter:blur(12px)
}

.ps{
font-size:11px;
font-weight:700
}

.pp{
margin-top:4px;
font-size:13px
}

.pch{
margin-top:4px;
font-size:11px
}

/* ===== SIGN ===== */

#sign{
position:relative;
z-index:2;
margin:2px 10px 0;
padding:8px 10px;
border-radius:14px;
background:
linear-gradient(135deg,
rgba(109,40,217,.16),
rgba(76,29,149,.06));
border:1px solid rgba(168,85,247,.18)
}

#signTitle{
font-size:10px;
letter-spacing:2px;
color:#c084fc
}

#signText{
margin-top:4px;
line-height:1.35;
font-size:11px;
color:#ddd6fe
}

/* ===== FEED ===== */

#feed{
position:relative;
z-index:2;
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
min-height:0
}

.msg{
max-width:88%;
padding:12px;
border-radius:20px;
line-height:1.6;
font-size:13px;
white-space:pre-wrap;
word-break:break-word
}

.user{
align-self:flex-end;
background:
linear-gradient(135deg,#6d28d9,#7c3aed)
}

.bot{
align-self:flex-start;
background:
linear-gradient(135deg,
rgba(30,41,59,.88),
rgba(17,24,39,.92));
border:1px solid rgba(255,255,255,.06)
}

/* ===== ACTIONS ===== */

#actions{
position:relative;
z-index:2;
display:flex;
gap:8px;
padding:0 10px 8px
}

.abtn{
flex:1;
padding:10px;
border-radius:14px;
border:1px solid rgba(168,85,247,.2);
background:
linear-gradient(135deg,
rgba(91,33,182,.16),
rgba(30,41,59,.25));
color:#fff;
font-size:12px;
cursor:pointer
}

/* ===== COINS ===== */

#coinsWrap{
position:relative;
z-index:2;
padding:8px 10px 10px;
border-top:1px solid rgba(255,255,255,.05)
}

#coinsTitle{
font-size:10px;
text-align:center;
letter-spacing:2px;
color:#9333ea;
margin-bottom:8px
}

#coins{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px
}

.cb{
padding:7px 4px;
border-radius:12px;
border:1px solid rgba(168,85,247,.18);
background:
linear-gradient(135deg,
rgba(91,33,182,.18),
rgba(17,24,39,.65));
color:#fff;
cursor:pointer;
min-height:58px
}

.cb:active{
transform:scale(.96)
}

.ci{
font-size:15px
}

.cs{
margin-top:4px;
font-size:10px;
font-weight:700
}

/* ===== MODALS ===== */

.modal{
position:fixed;
inset:0;
background:rgba(2,4,12,.94);
backdrop-filter:blur(18px);
z-index:90;
display:none;
flex-direction:column
}

.mtop{
display:flex;
justify-content:space-between;
align-items:center;
padding:
max(14px,env(safe-area-inset-top))
14px
14px
}

.mbody{
flex:1;
overflow-y:auto;
padding:14px
}

.close{
width:38px;
height:38px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.08);
color:#fff;
font-size:18px
}

/* ===== HOROSCOPE ===== */

#zodiacGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.zb{
padding:14px 6px;
border-radius:18px;
background:
linear-gradient(135deg,
rgba(91,33,182,.18),
rgba(17,24,39,.72));
border:1px solid rgba(168,85,247,.15);
text-align:center;
color:#fff
}

#zodiacResult{
display:none
}

#backZodiac{
margin-bottom:14px;
padding:10px 14px;
border:none;
border-radius:14px;
background:#5b21b6;
color:#fff
}

/* ===== RUNE ROOM ===== */

#runeModal{
background:
radial-gradient(circle at center,
rgba(91,33,182,.22) 0%,
rgba(5,8,16,.96) 55%,
rgba(2,4,12,1) 100%);
overflow:hidden
}

#runeModal::before{
content:'';
position:absolute;
width:420px;
height:420px;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
border:1px solid rgba(168,85,247,.12);
box-shadow:
0 0 40px rgba(168,85,247,.12),
inset 0 0 40px rgba(168,85,247,.08);
animation:runeRotate 40s linear infinite;
opacity:.7
}

#runeCard{
position:relative;
padding:40px 24px;
border-radius:34px;
text-align:center;
min-width:320px;
background:
linear-gradient(135deg,
rgba(91,33,182,.12),
rgba(17,24,39,.58));
border:1px solid rgba(168,85,247,.18);
backdrop-filter:blur(18px);
overflow:hidden;
box-shadow:
0 0 60px rgba(168,85,247,.16),
inset 0 0 40px rgba(255,255,255,.03);
animation:runeAppear 1s ease
}

#runeAura{
position:absolute;
width:240px;
height:240px;
border-radius:50%;
background:
radial-gradient(
circle,
rgba(168,85,247,.22) 0%,
rgba(168,85,247,.08) 40%,
transparent 70%
);
top:50%;
left:50%;
transform:translate(-50%,-50%);
filter:blur(20px);
pointer-events:none;
animation:auraPulse 4s ease-in-out infinite
}

#runeSymbol{
position:relative;
font-size:110px;
margin-bottom:18px;
color:#e9d5ff;
text-shadow:
0 0 20px rgba(192,132,252,.8),
0 0 60px rgba(168,85,247,.6);
animation:runePulse 3s ease-in-out infinite;
z-index:2
}

@keyframes runeRotate{
from{
transform:translate(-50%,-50%) rotate(0deg);
}
to{
transform:translate(-50%,-50%) rotate(360deg);
}
}

@keyframes runeAppear{
0%{
opacity:0;
transform:scale(.7) translateY(30px);
filter:blur(12px);
}
100%{
opacity:1;
transform:scale(1) translateY(0);
filter:blur(0);
}
}

@keyframes runePulse{
0%,100%{
transform:scale(1);
filter:brightness(1);
}
50%{
transform:scale(1.08);
filter:brightness(1.3);
}
}

@keyframes auraPulse{
0%,100%{
opacity:.6;
transform:translate(-50%,-50%) scale(1);
}
50%{
opacity:1;
transform:translate(-50%,-50%) scale(1.15);
}
}

</style>
</head>

<body>

<div id="stars"></div>

<div id="setup">

<div style="font-size:70px">🔮</div>

<h2>Крипто Нострадамус</h2>

<p>
Введите API ключ Groq.<br>
Ключ начинается с <b>gsk_</b>
</p>

<input
id="keyInput"
class="inp"
placeholder="gsk_..."
type="password"
>

<div id="err"></div>

<button class="btn" id="saveBtn">
✦ Войти в Оракул
</button>

</div>

<div id="app">

<div id="top">

<div id="logo">

<div id="orb">🔮</div>

<div>

<div id="ttl">
Крипто Нострадамус
</div>

<div id="sub">
ОНЛАЙН • ПРОРОЧЕСТВА
</div>

</div>

</div>

<div id="topBtns">

<button class="sbtn" id="shareTop">
📤
</button>

<button class="sbtn" id="installBtn">
📲
</button>

<button class="sbtn" id="changeKey">
🔑
</button>

</div>

</div>

<div id="prices"></div>

<div id="sign">

<div id="signTitle">
✨ ЗНАК ДНЯ
</div>

<div id="signText">
Нострадамус изучает движение звёзд...
</div>

</div>

<div id="feed"></div>

<div id="actions">

<button
class="abtn"
id="horoscopeBtn"
>
⭐ Криптогороскоп
</button>

<button
class="abtn"
id="runeBtn"
>
🎲 Мешочек Рун
</button>

</div>

<div id="coinsWrap">

<div id="coinsTitle">
✦ ВЫБЕРИТЕ МОНЕТУ ✦
</div>

<div id="coins"></div>

</div>

</div>

<div class="modal" id="runeModal">

<div class="mtop">

<div>
<div style="font-size:20px">
🎲 Мешочек Рун
</div>

<div style="font-size:12px;color:#a855f7;margin-top:4px">
Скандинавские пророчества
</div>
</div>

<button class="close" id="closeRune">
✕
</button>

</div>

<div
class="mbody"
style="display:flex;justify-content:center;align-items:center"
>

<div id="runeCard">

<div id="runeAura"></div>

<div id="runeSymbol">
ᚠ
</div>

<div
id="runeName"
style="font-size:24px"
>
Феху
</div>

<div
style="margin-top:10px;color:#c084fc"
id="runeTitle"
>
РУНА БОГАТСТВА
</div>

<div
style="
margin-top:18px;
line-height:1.8;
color:#ddd6fe;
max-width:280px
"
id="runeText"
>
Руна пробуждает денежные потоки.
</div>

</div>

</div>

</div>

<script>

'use strict';

/* ===== STARS ===== */

for(let i=0;i<60;i++){

const s=document.createElement('div');

s.className='star';

const size=Math.random()*2+1;

s.style.width=size+'px';
s.style.height=size+'px';

s.style.left=Math.random()*100+'%';
s.style.top=Math.random()*100+'%';

s.style.animationDelay=
Math.random()*5+'s';

document.getElementById('stars')
.appendChild(s);

}

/* ===== RUNES ===== */

const RUNES=[

{
symbol:'ᚠ',
name:'Феху',
title:'РУНА БОГАТСТВА',
text:'Денежные потоки усиливаются. BTC получает энергию накопления.'
},

{
symbol:'ᚢ',
name:'Уруз',
title:'РУНА СИЛЫ',
text:'Рынок собирает мощь перед сильным движением.'
},

{
symbol:'ᚦ',
name:'Турисаз',
title:'РУНА ПЕРЕЛОМА',
text:'Впереди зона турбулентности и опасных колебаний.'
},

{
symbol:'ᚨ',
name:'Ансуз',
title:'РУНА ЗНАНИЯ',
text:'Информация станет главным источником прибыли.'
},

{
symbol:'ᚱ',
name:'Райдо',
title:'РУНА ПУТИ',
text:'Тренд начинает менять направление движения.'
},

{
symbol:'ᚲ',
name:'Кеназ',
title:'РУНА ОГНЯ',
text:'Скрытая возможность скоро откроет путь к росту.'
}

];

function G(id){
return document.getElementById(id);
}

/* ===== RUNES ===== */

function loadRune(){

const rune=
RUNES[
Math.floor(
Math.random()*RUNES.length
)
];

G('runeSymbol').textContent=rune.symbol;
G('runeName').textContent=rune.name;
G('runeTitle').textContent=rune.title;
G('runeText').textContent=rune.text;

}

G('runeBtn').onclick=()=>{

loadRune();

G('runeModal').style.display='flex';

};

G('closeRune').onclick=()=>{

G('runeModal').style.display='none';

};

</script>

</body>
</html>
