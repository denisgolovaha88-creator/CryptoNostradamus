<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CryptoNost">

<link rel="manifest" href="manifest.json">

<title>Крипто Нострадамус</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050810;font-family:Georgia,serif;color:#e2e8f0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
#app{width:100vw;height:100vh;display:none;flex-direction:column;background:#050810}
#setup{
position:fixed;inset:0;z-index:50;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
padding:24px;
background:#050810;
gap:12px;
text-align:center
}
.inp{
width:100%;
max-width:340px;
padding:14px;
border-radius:14px;
border:1px solid #7c3aed;
background:#0f172a;
color:#fff;
outline:none;
font-size:15px
}
.btn{
padding:14px 18px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#6d28d9,#7c3aed);
color:#fff;
cursor:pointer;
font-size:15px;
width:100%;
max-width:340px
}
#feed{
flex:1;
overflow-y:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:10px
}
.msg{
padding:12px 14px;
border-radius:16px;
line-height:1.55;
white-space:pre-wrap;
font-size:14px
}
.u{
background:#4c1d95;
align-self:flex-end;
max-width:84%
}
.b{
background:#111827;
border:1px solid rgba(255,255,255,.08);
max-width:88%
}
#coins{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
padding:12px;
border-top:1px solid rgba(255,255,255,.08)
}
.cb{
padding:14px 8px;
border-radius:14px;
border:1px solid rgba(124,58,237,.4);
background:#111827;
color:#fff;
cursor:pointer;
font-size:13px
}
#top{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center
}
#prices{
display:flex;
gap:6px;
overflow-x:auto;
padding:10px
}
.pc{
min-width:90px;
padding:8px;
border-radius:12px;
background:#111827;
font-size:12px;
text-align:center;
border:1px solid rgba(255,255,255,.06)
}
#err{
font-size:12px;
color:#ef4444;
min-height:16px
}
.loading{
opacity:.7
}
</style>
</head>
<body>

<div id="setup">
<div style="font-size:52px">🔮</div>
<h2>Крипто Нострадамус</h2>

<p style="color:#a78bfa;font-size:13px;line-height:1.6">
Введите API ключ Grok / xAI
</p>

<input id="keyInput" class="inp" placeholder="xai-..." type="password">

<div id="err"></div>

<button class="btn" id="saveBtn">
✦ Войти
</button>

<p style="font-size:11px;color:#64748b;line-height:1.7">
1. Открой console.x.ai<br>
2. API Keys → Create API Key<br>
3. Вставь ключ
</p>
</div>

<div id="app">

<div id="top">
<div>
<div style="font-weight:700">🔮 Крипто Нострадамус</div>
<div style="font-size:11px;color:#a78bfa">Live AI Crypto Oracle</div>
</div>

<button id="changeKey" class="btn" style="width:auto;padding:10px 12px;font-size:12px">
🔑 Ключ
</button>
</div>

<div id="prices"></div>

<div id="feed"></div>

<div id="coins"></div>

</div>

<script>
'use strict';

/* =========================
   CONFIG
========================= */

const COINS = [
{
id:'bitcoin',
sym:'BTC',
name:'Bitcoin',
icon:'₿'
},
{
id:'ethereum',
sym:'ETH',
name:'Ethereum',
icon:'Ξ'
},
{
id:'solana',
sym:'SOL',
name:'Solana',
icon:'◎'
},
{
id:'ripple',
sym:'XRP',
name:'XRP',
icon:'✕'
},
{
id:'litecoin',
sym:'LTC',
name:'Litecoin',
icon:'Ł'
},
{
id:'binancecoin',
sym:'BNB',
name:'BNB',
icon:'◆'
}
];

let prices = {};
let busy = false;

/* =========================
   HELPERS
========================= */

function G(id){
return document.getElementById(id);
}

function saveKey(v){
localStorage.setItem('grok_key',v);
}

function getKey(){
return localStorage.getItem('grok_key') || '';
}

function addMsg(type,text){

const d = document.createElement('div');

d.className = 'msg ' + (type === 'user' ? 'u' : 'b');

d.textContent = text;

G('feed').appendChild(d);

G('feed').scrollTop = G('feed').scrollHeight;

return d;
}

function fmt(v){

if(v >= 10000){
return '$' + v.toLocaleString('en',{
maximumFractionDigits:0
});
}

if(v >= 1){
return '$' + v.toFixed(2);
}

return '$' + v.toFixed(4);
}

/* =========================
   COINGECKO
========================= */

async function loadPrices(){

try{

const ids = COINS.map(c => c.id).join(',');

const r = await fetch(
'https://api.coingecko.com/api/v3/simple/price?ids='
+ ids +
'&vs_currencies=usd&include_24hr_change=true'
);

const data = await r.json();

prices = data;

renderPrices();

}catch(e){
console.log(e);
}

}

function renderPrices(){

const wrap = G('prices');

wrap.innerHTML = '';

COINS.forEach(c => {

const p = prices[c.id];

const price = p?.usd || 0;

const ch = p?.usd_24h_change || 0;

const el = document.createElement('div');

el.className = 'pc';

el.innerHTML =
'<div style="font-weight:700">' + c.sym + '</div>' +
'<div style="margin-top:4px">' + fmt(price) + '</div>' +
'<div style="margin-top:4px;color:' +
(ch >= 0 ? '#22c55e' : '#ef4444') +
'">' +
(ch >= 0 ? '▲ ' : '▼ ') +
Math.abs(ch).toFixed(2) +
'%</div>';

wrap.appendChild(el);

});

}

/* =========================
   FIXED AI REQUEST
========================= */

async function callAI(prompt){

const key = getKey();

if(!key){
throw new Error('Нет API ключа');
}

/*
  ОСНОВНОЙ FIX:

  Было:
  model:'grok-3-mini-fast'

  На дешёвых ключах / free tier
  часто вызывает 400.

  Используем:
  grok-2-1212
*/

const body = {
messages:[
{
role:'system',
content:
'Ты Крипто Нострадамус. Отвечай только на русском языке. Давай краткий криптоанализ.'
},
{
role:'user',
content:prompt
}
],

model:'grok-2-1212',

temperature:0.7,

max_tokens:500
};

const r = await fetch(
'https://api.x.ai/v1/chat/completions',
{
method:'POST',
headers:{
'Content-Type':'application/json',
'Authorization':'Bearer ' + key
},
body:JSON.stringify(body)
}
);

/*
  FIX ERROR 400
*/

if(r.status === 400){

const txt = await r.text();

console.log(txt);

throw new Error(
'Ошибка 400. Скорее всего модель недоступна для этого ключа.'
);
}

if(r.status === 401){
throw new Error('Неверный API ключ');
}

if(r.status === 429){
throw new Error('Лимит запросов исчерпан');
}

if(!r.ok){
throw new Error('Ошибка API: ' + r.status);
}

const data = await r.json();

if(
!data ||
!data.choices ||
!data.choices[0]
){
throw new Error('Пустой ответ');
}

return data.choices[0].message.content.trim();

}

/* =========================
   ANALYZE
========================= */

async function analyzeCoin(c){

if(busy)return;

busy = true;

addMsg(
'user',
'🔍 Анализ ' + c.name
);

const bot = addMsg(
'bot',
'⏳ Нострадамус смотрит в графики...'
);

try{

const p = prices[c.id];

const txt = await callAI(
`
Монета: ${c.name} (${c.sym})

Цена:
${p?.usd || 'нет данных'} USD

Изменение за 24ч:
${(p?.usd_24h_change || 0).toFixed(2)}%

Сделай краткий криптоанализ.

Структура:

1. Тренд
2. Поддержка
3. Сопротивление
4. Риск
5. Вердикт

Максимум 120 слов.
`
);

bot.textContent = txt;

}catch(e){

bot.textContent =
'❌ ' + e.message;

}

busy = false;

}

/* =========================
   COIN BUTTONS
========================= */

function renderCoins(){

const wrap = G('coins');

wrap.innerHTML = '';

COINS.forEach(c => {

const b = document.createElement('button');

b.className = 'cb';

b.innerHTML =
'<div style="font-size:18px">' +
c.icon +
'</div>' +
'<div style="margin-top:6px">' +
c.sym +
'</div>';

b.onclick = () => analyzeCoin(c);

wrap.appendChild(b);

});

}

/* =========================
   START
========================= */

function start(){

G('setup').style.display = 'none';

G('app').style.display = 'flex';

renderCoins();

loadPrices();

setInterval(loadPrices,30000);

addMsg(
'bot',
'🔮 Добро пожаловать.\n\nВыберите монету для пророчества.'
);

}

/* =========================
   EVENTS
========================= */

G('saveBtn').onclick = () => {

const v =
G('keyInput').value.trim();

if(v.length < 10){

G('err').textContent =
'Введите API ключ';

return;
}

saveKey(v);

start();

};

G('changeKey').onclick = () => {

G('setup').style.display = 'flex';

G('app').style.display = 'none';

G('keyInput').value = getKey();

};

if(getKey()){

start();

}

/* =========================
   PWA
========================= */

if('serviceWorker' in navigator){

navigator.serviceWorker.register('./sw.js');

}
</script>

</body>
</html>
