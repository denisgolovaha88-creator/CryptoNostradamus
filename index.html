<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#6d28d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<title>Крипто Нострадамус</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html{
width:100%;
height:100%;
overflow:hidden;
background:#040712;
}

body{
width:100%;
height:100%;
overflow:hidden;
background:#040712;
font-family:Georgia,serif;
color:#fff;
}

/* ===== APP ===== */

#app{
position:fixed;
inset:0;
width:100%;
height:100dvh;
height:-webkit-fill-available;
overflow:hidden;
display:none;
flex-direction:column;
background:
radial-gradient(circle at top,#1d1040 0%,#050810 40%,#02040c 100%);
padding-bottom:env(safe-area-inset-bottom);
}

/* ===== STARS ===== */

#stars{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0
}

.star{
position:absolute;
background:#fff;
border-radius:50%;
opacity:.4;
animation:twinkle 4s infinite
}

@keyframes twinkle{
0%,100%{opacity:.1}
50%{opacity:.8}
}

/* ===== SETUP ===== */

#setup{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:24px;
background:
radial-gradient(circle at top,#1f1144 0%,#050810 55%);
z-index:50;
text-align:center;
overflow-y:auto;
}

#setup h2{
font-size:30px;
margin-top:10px
}

#setup p{
font-size:13px;
line-height:1.8;
color:#b794f4;
margin-top:8px;
max-width:320px
}

.inp{
width:100%;
max-width:340px;
padding:15px;
border-radius:16px;
border:1px solid rgba(168,85,247,.4);
background:rgba(255,255,255,.05);
color:#fff;
outline:none;
font-size:15px;
margin-top:18px
}

.btn{
border:none;
cursor:pointer;
border-radius:16px;
background:
linear-gradient(135deg,#5b21b6,#7c3aed);
color:#fff;
padding:15px;
font-size:15px;
width:100%;
max-width:340px;
margin-top:12px;
box-shadow:0 0 24px rgba(124,58,237,.35)
}

#err{
font-size:12px;
color:#ef4444;
margin-top:10px;
min-height:16px
}

/* ===== TOP ===== */

#top{
position:relative;
z-index:2;
display:flex;
justify-content:space-between;
align-items:center;
padding:
calc(env(safe-area-inset-top) + 10px)
14px
12px;
border-bottom:1px solid rgba(255,255,255,.06);
background:rgba(5,8,16,.82);
backdrop-filter:blur(18px)
}

#logo{
display:flex;
gap:12px;
align-items:center
}

#orb{
width:52px;
height:52px;
border-radius:50%;
background:
linear-gradient(135deg,#6d28d9,#9333ea);
display:flex;
justify-content:center;
align-items:center;
font-size:25px;
box-shadow:0 0 24px rgba(168,85,247,.45)
}

#ttl{
font-size:15px;
font-weight:700;
line-height:1.1;
}

#sub{
font-size:10px;
color:#a855f7;
margin-top:2px;
letter-spacing:2px
}

#topBtns{
display:flex;
gap:8px;
align-items:center
}

.sbtn{
border:none;
border-radius:16px;
padding:10px 14px;
font-size:13px;
background:
linear-gradient(135deg,
rgba(109,40,217,.28),
rgba(76,29,149,.18));
border:1px solid rgba(168,85,247,.15);
color:#fff;
cursor:pointer;
box-shadow:0 0 22px rgba(124,58,237,.18)
}

/* ===== PRICES ===== */

#prices{
position:relative;
z-index:2;
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 12px;
scrollbar-width:none;
min-height:88px;
}

.pc{
min-width:90px;
padding:10px;
border-radius:16px;
background:rgba(255,255,255,.04);
border:1px solid rgba(168,85,247,.18);
backdrop-filter:blur(12px)
}

.ps{
font-size:12px;
font-weight:700
}

.pp{
margin-top:6px;
font-size:15px
}

.pch{
margin-top:5px;
font-size:12px
}

/* ===== SIGN ===== */

#sign{
position:relative;
z-index:2;
margin:0 12px;
padding:10px 14px;
border-radius:18px;
background:
linear-gradient(135deg,
rgba(109,40,217,.16),
rgba(76,29,149,.08));
border:1px solid rgba(168,85,247,.18);
min-height:auto;
}

#signTitle{
font-size:11px;
letter-spacing:3px;
color:#c084fc
}

#signText{
margin-top:6px;
line-height:1.5;
font-size:13px;
color:#ddd6fe
}

/* ===== FEED ===== */

#feed{
position:relative;
z-index:2;
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
min-height:0;
-webkit-overflow-scrolling:touch;
}

.msg{
max-width:88%;
padding:14px;
border-radius:22px;
line-height:1.7;
font-size:14px;
white-space:pre-wrap;
word-break:break-word
}

.user{
align-self:flex-end;
background:
linear-gradient(135deg,#6d28d9,#7c3aed)
}

.bot{
align-self:flex-start;
background:
linear-gradient(135deg,
rgba(30,41,59,.88),
rgba(17,24,39,.92));
border:1px solid rgba(255,255,255,.06)
}

/* ===== ACTIONS ===== */

#actions{
position:relative;
z-index:2;
display:flex;
gap:10px;
padding:8px 12px 0
}

.abtn{
flex:1;
padding:12px;
border-radius:18px;
border:1px solid rgba(168,85,247,.2);
background:
linear-gradient(135deg,
rgba(91,33,182,.16),
rgba(30,41,59,.25));
color:#fff;
font-size:14px;
cursor:pointer
}

/* ===== COINS ===== */

#coinsWrap{
position:relative;
z-index:2;
padding:10px 12px;
padding-bottom:
calc(env(safe-area-inset-bottom) + 10px);
border-top:1px solid rgba(255,255,255,.05)
}

#coinsTitle{
font-size:11px;
text-align:center;
letter-spacing:3px;
color:#9333ea;
margin-bottom:8px
}

#coins{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.cb{
padding:10px 4px;
min-height:72px;
border-radius:18px;
border:1px solid rgba(168,85,247,.18);
background:
linear-gradient(135deg,
rgba(91,33,182,.18),
rgba(17,24,39,.65));
color:#fff;
cursor:pointer
}

.cb:active{
transform:scale(.96)
}

.ci{
font-size:20px
}

.cs{
margin-top:6px;
font-size:12px;
font-weight:700
}

/* ===== MODAL ===== */

.modal{
position:fixed;
inset:0;
background:rgba(2,4,12,.94);
backdrop-filter:blur(18px);
z-index:90;
display:none;
flex-direction:column
}

.mtop{
display:flex;
justify-content:space-between;
align-items:center;
padding:
calc(env(safe-area-inset-top) + 12px)
14px
14px
}

.mbody{
flex:1;
overflow-y:auto;
padding:14px;
-webkit-overflow-scrolling:touch;
}

.close{
width:38px;
height:38px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.08);
color:#fff;
font-size:18px
}

/* ===== ZODIAC ===== */

#zodiacGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.zb{
padding:14px 6px;
border-radius:18px;
background:
linear-gradient(135deg,
rgba(91,33,182,.18),
rgba(17,24,39,.72));
border:1px solid rgba(168,85,247,.15);
text-align:center;
color:#fff
}

/* ===== RUNE ===== */

#runeCard{
padding:24px;
border-radius:26px;
text-align:center;
background:
linear-gradient(135deg,
rgba(91,33,182,.22),
rgba(17,24,39,.82));
border:1px solid rgba(168,85,247,.18)
}

#runeSymbol{
font-size:70px;
margin-bottom:10px
}

/* ===== MOBILE FIX ===== */

@supports (-webkit-touch-callout:none){

html{
height:-webkit-fill-available;
}

body{
height:-webkit-fill-available;
}

#app{
height:-webkit-fill-available;
}

}
</style>
</head>

<body>

<div id="stars"></div>

<div id="setup">

<div style="font-size:70px">🔮</div>

<h2>Крипто Нострадамус</h2>

<p>
Введите API ключ Groq.<br>
Ключ начинается с <b>gsk_</b><br><br>

1. Открой console.groq.com<br>
2. API Keys → Create Key<br>
3. Скопируй ключ вида gsk_xxx<br><br>

✨ Бесплатный API для пророчеств
</p>

<input
id="keyInput"
class="inp"
placeholder="gsk_..."
type="password"
>

<div id="err"></div>

<button class="btn" id="saveBtn">
✦ Войти в Оракул
</button>

</div>

<div id="app">

<div id="top">

<div id="logo">

<div id="orb">🔮</div>

<div>

<div id="ttl">
Крипто<br>Нострадамус
</div>

<div id="sub">
ОНЛАЙН • ПРОРОЧЕСТВА
</div>

</div>

</div>

<div id="topBtns">

<button class="sbtn" id="installBtn">
📲 Сохранить
</button>

<button class="sbtn" id="shareTop">
🔗 Поделиться
</button>

</div>

</div>

<div id="prices"></div>

<div id="sign">

<div id="signTitle">
✨ ЗНАК ДНЯ
</div>

<div id="signText">
Нострадамус изучает движение звёзд...
</div>

</div>

<div id="feed"></div>

<div id="actions">

<button class="abtn" id="horoscopeBtn">
⭐ Криптогороскоп
</button>

<button class="abtn" id="runeBtn">
🎲 Мешочек Рун
</button>

</div>

<div id="coinsWrap">

<div id="coinsTitle">
✦ ВЫБЕРИТЕ МОНЕТУ ✦
</div>

<div id="coins"></div>

</div>

</div>

<script>
'use strict';

let deferredPrompt=null;

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault();
deferredPrompt=e;
});

/* ===== INSTALL ===== */

document.getElementById('installBtn').onclick=async()=>{

if(deferredPrompt){

deferredPrompt.prompt();

await deferredPrompt.userChoice;

deferredPrompt=null;

}else{

alert(
'Для установки:\n\nChrome:\nМеню → Добавить на главный экран\n\nOpera:\nМеню → Установить приложение'
);

}

};
</script>

</body>
</html>
